groups:
  - name: project-management-alerts
    rules:
      - alert: ApiP99LatencyHigh
        expr: histogram_quantile(0.99, sum by (le, method, path) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API P99 latency is above 1.5s
          description: API route {{ $labels.method }} {{ $labels.path }} has P99 latency above the SLA.

      - alert: ApiErrorRateHigh
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API error rate is above 1%
          description: Backend 5xx responses exceeded 1% over the last 5 minutes.

      - alert: CeleryQueueBacklogHigh
        expr: max(celery_queue_length) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Celery queue backlog is above 100
          description: Celery pending queue length has stayed above the backlog threshold.
